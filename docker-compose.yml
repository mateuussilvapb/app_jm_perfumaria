services:
  app:
    build: .
    container_name: spring_jm_perfumaria_back
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_app_jm_perfumaria:5432/app_jm_perfumaria
      SPRING_DATASOURCE_USERNAME: jm_user
      SPRING_DATASOURCE_PASSWORD: jm_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SERVER_PORT: 8081
    depends_on:
      db_app_jm_perfumaria:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks:
      - spring-keycloak-network

  db_app_jm_perfumaria:
    image: postgres:18
    container_name: db_jm_perfumaria
    environment:
      POSTGRES_DB: app_jm_perfumaria
      POSTGRES_USER: jm_user
      POSTGRES_PASSWORD: jm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data # Remove this in linux aws
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jm_user -d app_jm_perfumaria || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - spring-keycloak-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak_jm_perfumaria
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db_app_jm_perfumaria:5432/app_jm_perfumaria
      KC_DB_USERNAME: jm_user
      KC_DB_PASSWORD: jm_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: https://auth.54-233-124-101.sslip.io
      KC_PROXY: edge
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_PORT: 8080
      mem_limit: 500m
      KC_HTTP_ENABLED: "true"
    command: ["start-dev"]
    ports:
      - 8443:8443
      - 8080:8080
    depends_on:
      db_app_jm_perfumaria:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spring-keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; exit $?"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  nginx:
    image: nginx:latest
    container_name: nginx_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist/app_jm_perfumaria/browser:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt/live/54-233-124-101.sslip.io/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/54-233-124-101.sslip.io/privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      - app
      - keycloak
      - db_app_jm_perfumaria
    networks:
      - spring-keycloak-network

volumes:
  postgres_data:
    name: postgres_app_data

networks:
  spring-keycloak-network:
    name: spring-keycloak-network
    driver: bridge