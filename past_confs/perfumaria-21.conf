server {
        listen 80;
        server_name 54-233-124-101.nip.io;
        rewrite ^https://54-233-124-101.nip.io permanent;
}

server {
        listen 443 ssl;
        server_name 54-233-124-101.nip.io;

        ssl_certificate /etc/letsencrypt/live/54-233-124-101.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/54-233-124-101.nip.io/privkey.pem;
        ssl_session_cache builtin:1000 shared:ssl:10m;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
        ssl_prefer_server_ciphers on;

	#location /keycloak/ {
	#	rewrite ^/keycloak/(.*)$ /$1 break;
        #        proxy_set_header        Host                    $host;
        #        proxy_set_header        X-Real-IP               $remote_addr;
        #        proxy_set_header        X-Forwarded-For         $proxy_add_x_forwarded_for;
        #        proxy_set_header        X-Forwarded-Proto       $scheme;
        #        proxy_pass http://54.233.124.101:8080;
        #}

	location / {
                proxy_set_header        Host                    $host;
                proxy_set_header        X-Real-IP               $remote_addr;
                proxy_set_header        X-Forwarded-For         $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto       $scheme;
		try_files $uri $uri$args $uri$args/ /index.html;
        #        proxy_pass http://54.233.124.101:8081;
        }
}