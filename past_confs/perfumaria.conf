# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name 54-233-124-101.nip.io www.54-233-124-101.nip.io;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name 54-233-124-101.nip.io www.54-233-124-101.nip.io;

    # SSL certificates (mounted from your certbot container or host)
    ssl_certificate /etc/letsencrypt/live/54-233-124-101.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54-233-124-101.nip.io/privkey.pem;

    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # -------------------------------------------------------
    # Route to Keycloak
    # Accessible at https://mydomain/auth
    # -------------------------------------------------------
    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Route to Spring Boot app
    # Accessible at https://mydomain/
    # -------------------------------------------------------
    location / {
        proxy_pass http://spring-app:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
